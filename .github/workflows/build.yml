name: Build Minecraft Mod 1.12.2

on:
  push:
    branches: [ 1.12.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '4.10.3'

      - name: Build with Gradle
        run: gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v5
        with:
          name: naturaldisasters-1.12.2
          path: build/libs/*.jar
