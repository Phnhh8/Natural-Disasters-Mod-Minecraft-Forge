plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0,8.0)'
}

version = '1.0.0'
group = 'com.example.disasters'

base {
    archivesName = 'naturaldisasters-26.3'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: '26.3'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'naturaldisasters'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'naturaldisasters'
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:26.3-66.1.9'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
