plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0,8.0)'
}

version = '1.0.0'
group = 'com.example.disasters'

base {
    archivesName = 'naturaldisasters-26.3'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: '26.3'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            systemProperty 'forge.enabledGameTestNamespaces', 'naturaldisasters'
        }

        server {
            systemProperty 'forge.enabledGameTestNamespaces', 'naturaldisasters'
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(repositories)
    maven { url = 'https://' + 'maven.minecraftforge.net/' }
    maven { url = 'https://' + 'libraries.minecraft.net/' }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.9')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
