plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    runs {
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(repositories)
    maven { url = 'https://minecraftforge.net' }
    maven { url = 'https://minecraft.net' }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}
